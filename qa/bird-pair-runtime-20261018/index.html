<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><title>Bird pair runtime QA</title><style>body{margin:0;background:#e8e4dc;color:#25362f;font:15px system-ui}header{padding:12px}canvas{display:block}button{padding:8px;margin:4px}pre{font-size:12px;white-space:pre-wrap}</style><header>Cloud Three.js 0.180.0 runtime QA <button id="run">Run narrow checks</button><button id="orbit">Orbit 45°</button><select id="asset"><option>ichthyornis</option><option>confuciusornis</option></select><button id="dup">Show 12 props</button><span id="status">Loading</span></header><div id="viewport"></div><pre id="report"></pre><script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const status=document.querySelector('#status'),out=document.querySelector('#report'),names=['ichthyornis','confuciusornis'];const evidence=window.qaEvidence={three:T.REVISION,errors:[],loads:[],disposals:[],orbits:0,duplicateScene:null};
window.addEventListener('error',e=>{evidence.errors.push(e.message);show()});window.addEventListener('unhandledrejection',e=>{evidence.errors.push(String(e.reason));show()});
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1100,560);renderer.setPixelRatio(1);document.querySelector('#viewport').appendChild(renderer.domElement);const gl=renderer.getContext();const debug=gl.getExtension('WEBGL_debug_renderer_info');evidence.renderer=debug?gl.getParameter(debug.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);evidence.webgl=gl.getParameter(gl.VERSION);
const scene=new T.Scene();scene.background=new T.Color('#e8e4dc');scene.add(new T.HemisphereLight(0xffffff,0x5a6350,2.3));const light=new T.DirectionalLight(0xffffff,3);light.position.set(3,5,4);scene.add(light);const camera=new T.PerspectiveCamera(40,1100/560,.001,100);const controls=new OrbitControls(camera,renderer.domElement);let group=new T.Group();scene.add(group);let serial=0;
function render(){controls.update();renderer.render(scene,camera)}function show(){out.textContent=JSON.stringify({...evidence,canvasCount:document.querySelectorAll('canvas').length,memory:renderer.info.memory,drawCalls:renderer.info.render.calls},null,2)}
function clear(){const geo=new Set(),mats=new Set();group.traverse(o=>{if(o.isMesh){geo.add(o.geometry);(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>mats.add(m))}});group.clear();geo.forEach(g=>g.dispose());mats.forEach(m=>m.dispose());renderer.renderLists.dispose();render();evidence.disposals.push({...renderer.info.memory});}
function frame(){const b=new T.Box3().setFromObject(group),c=b.getCenter(new T.Vector3()),size=b.getSize(new T.Vector3()).length();controls.target.copy(c);camera.position.copy(c).add(new T.Vector3(.8,.55,1).normalize().multiplyScalar(size*1.7));camera.near=size/1000;camera.far=size*100;camera.updateProjectionMatrix();render()}
async function load(name){clear();const gltf=await new GLTFLoader().loadAsync(`assets/${name}.glb`);group.add(gltf.scene);frame();const pixels=new Uint8Array(1100*560*4);gl.readPixels(0,0,1100,560,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let different=0;for(let i=0;i<pixels.length;i+=4)if(Math.abs(pixels[i]-pixels[0])+Math.abs(pixels[i+1]-pixels[1])+Math.abs(pixels[i+2]-pixels[2])>30)different++;const error=gl.getError();evidence.loads.push({name,nonBackgroundPixels:different,glError:error,geometries:renderer.info.memory.geometries,canvasCount:document.querySelectorAll('canvas').length});if(!different||error)evidence.errors.push(`${name}: empty image or GL error`);status.textContent=name;show();}
function orbit(){const p=camera.position.clone().sub(controls.target);p.applyAxisAngle(new T.Vector3(0,1,0),Math.PI/4);camera.position.copy(controls.target).add(p);render();evidence.orbits++;evidence.lastOrbitGLError=gl.getError();show()}
async function duplicates(){clear();for(let i=0;i<12;i++){const name=names[i%names.length],g=(await new GLTFLoader().loadAsync(`assets/${name}.glb`)).scene;const b=new T.Box3().setFromObject(g);const s=b.getSize(new T.Vector3());g.scale.setScalar(.65/Math.max(s.x,s.y,s.z));g.position.set((i%4-1.5)*.9,0,(Math.floor(i/4)-1)*.8);group.add(g)}frame();evidence.duplicateScene={count:12,scale:'normalized display size for mixed-prop inspection, not biological scale',drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,glError:gl.getError()};status.textContent='12 mixed props rendered';show()}
document.querySelector('#run').onclick=async()=>{try{status.textContent='Running';for(let i=0;i<6;i++)for(const n of names){await load(n);orbit()}await duplicates();evidence.completed=true;show();status.textContent=evidence.errors.length?'FAIL':'PASS: 12 switches, 12 orbits, 12 mixed props';}catch(e){evidence.errors.push(String(e));show();status.textContent='FAIL'}};document.querySelector('#asset').onchange=e=>load(e.target.value);document.querySelector('#orbit').onclick=orbit;document.querySelector('#dup').onclick=duplicates;controls.addEventListener('change',()=>renderer.render(scene,camera));await load(names[0]);
</script>

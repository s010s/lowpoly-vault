name: Compare scrollbar modal regression against exact main
on:
  push:
    branches: ['fix/catalog-scrollbar-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scrollbar-modal-comparison-${{ github.ref }}
  cancel-in-progress: true
env:
  SITE_BASE: /lowpoly-vault/
  SITE_ORIGIN: https://s010s.github.io
jobs:
  same-runner-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 12550349a9678398b9360e97d7908bc42667c42c
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the exact previous production tree
        run: |
          ln -s ../node_modules baseline/node_modules
          cd baseline
          npm run build
      - name: Enforce unchanged full modal contracts on previous production
        id: baseline
        continue-on-error: true
        env:
          GITHUB_SHA: 12550349a9678398b9360e97d7908bc42667c42c
          GALLERY_DIR: baseline/dist
          QA_OUTPUT_DIR: qa/scrollbar-modal-comparison/baseline
        run: node site/modal-motion-browser-test.mjs
      - run: npm run build
      - name: Enforce the same full modal contracts on candidate, once
        id: candidate
        continue-on-error: true
        env:
          QA_OUTPUT_DIR: qa/scrollbar-modal-comparison/candidate
        run: node site/modal-motion-browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrollbar-modal-same-runner-${{ github.sha }}
          path: qa/scrollbar-modal-comparison/
      - name: Preserve both outcomes as blocking results
        if: always()
        env:
          BASELINE_RESULT: ${{ steps.baseline.outcome }}
          CANDIDATE_RESULT: ${{ steps.candidate.outcome }}
        run: test "$BASELINE_RESULT" = success && test "$CANDIDATE_RESULT" = success

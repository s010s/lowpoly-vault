name: Post-release fixture regression
on:
  pull_request:
    paths:
      - site/ci-post-release-browser-test.mjs
      - site/ci-post-release-browser.mjs
      - site/gallery-thumbnail-reveal-browser-test.mjs
      - .github/workflows/postrelease-fixture-regression.yml
permissions:
  contents: read
jobs:
  browser-fixture-regression:
    name: Real Chromium post-release fixture regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node site/ci-install-chromium.mjs
      - name: Run actual lifecycle, rejection and thumbnail fixtures before merge
        env:
          QA_OUTPUT_DIR: qa/post-release-browser-regression
        run: node site/ci-post-release-browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-fixture-regression-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/post-release-browser-regression/
          if-no-files-found: error

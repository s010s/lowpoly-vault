name: Test standardized asset pipeline
on:
  workflow_dispatch:
  push:
    branches: [main, 'quality/**']
    paths:
      - 'scripts/**'
      - 'schemas/**'
      - 'qa/pipeline-pilot/**'
      - 'skills/**'
      - 'site/generate-manifest.mjs'
      - 'site/manifest-test.mjs'
      - 'site/ci-timed*.mjs'
      - 'package*.json'
      - '.github/workflows/asset-pipeline.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'schemas/**'
      - 'qa/pipeline-pilot/**'
      - 'skills/**'
      - 'site/generate-manifest.mjs'
      - 'site/manifest-test.mjs'
      - 'site/ci-timed*.mjs'
      - 'package*.json'
      - '.github/workflows/asset-pipeline.yml'
permissions:
  contents: read
concurrency:
  group: asset-pipeline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity-and-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npm run test:pipeline
      - run: npm run test:manifest
      - run: npm run test:publication
      - run: npm run publication:check
      - name: State verification scope
        run: |
          echo '### Asset pipeline integrity and queue tests' >> "$GITHUB_STEP_SUMMARY"
          echo 'Checks fail-closed evidence records, bounded subprocess behavior, strict formal release gating, and the unchanged initial-ten exception.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This job does not run Blender, inspect images, certify facts, or approve an asset. Real-render pilot evidence is reported separately.' >> "$GITHUB_STEP_SUMMARY"

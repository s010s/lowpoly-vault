name: Test standardized asset pipeline
on:
  workflow_dispatch:
  push:
    branches: [main, 'quality/**']
    paths:
      - 'scripts/**'
      - 'qa/final-delivery-20261021/**'
      - 'assets/additions/**'
      - 'production/small-life-batch109/**'
      - 'production/batch-108/**'
      - 'site/final-delivery*.mjs'
      - 'site/final-five*.mjs'
      - 'schemas/**'
      - 'qa/pipeline-pilot/**'
      - 'skills/**'
      - 'site/generate-manifest.mjs'
      - 'site/manifest-test.mjs'
      - 'site/ci-timed*.mjs'
      - 'site/ci-publication-shards*.mjs'
      - '.github/workflows/publication-regressions.yml'
      - 'package*.json'
      - '.github/workflows/asset-pipeline.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'qa/final-delivery-20261021/**'
      - 'assets/additions/**'
      - 'production/small-life-batch109/**'
      - 'production/batch-108/**'
      - 'site/final-delivery*.mjs'
      - 'site/final-five*.mjs'
      - 'schemas/**'
      - 'qa/pipeline-pilot/**'
      - 'skills/**'
      - 'site/generate-manifest.mjs'
      - 'site/manifest-test.mjs'
      - 'site/ci-timed*.mjs'
      - 'site/ci-publication-shards*.mjs'
      - '.github/workflows/publication-regressions.yml'
      - 'package*.json'
      - '.github/workflows/asset-pipeline.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: asset-pipeline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity-and-queue:
    runs-on: ubuntu-latest
    # Publication mutation suites run in separate, isolated runner jobs above.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - name: Test pipeline implementation when affected
        run: node site/ci-lean-regressions.mjs pipeline
      - name: State verification scope
        run: |
          echo '### Asset pipeline integrity and queue tests' >> "$GITHUB_STEP_SUMMARY"
          echo 'Checks fail-closed evidence records, bounded subprocess behavior, strict formal release gating, and the unchanged initial-ten exception.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This job does not run Blender, inspect images, certify facts, or approve an asset. Real-render pilot evidence is reported separately.' >> "$GITHUB_STEP_SUMMARY"

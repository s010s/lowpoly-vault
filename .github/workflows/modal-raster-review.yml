name: Diagnose cached modal rasterization
on:
  push:
    branches: ['diagnose/modal-raster-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modal-raster-${{ github.ref }}
  cancel-in-progress: false
env:
  SITE_BASE: /lowpoly-vault/
  SITE_ORIGIN: https://s010s.github.io
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Freeze provenance and runner resources
        run: |
          mkdir -p qa/modal-raster-diagnosis
          git rev-parse HEAD > qa/modal-raster-diagnosis/commit.txt
          git diff --exit-code 881f89a74a35d5568898f0a1f99dfecda0a48f84 -- site/main.js site/viewer.js site/style.css site/dialog-motion.js site/image-scrub.js
          sha256sum dist/assets/index-*.js dist/assets/viewer-*.js dist/assets/index-*.css > qa/modal-raster-diagnosis/built-runtime-sha256.txt
          uname -a > qa/modal-raster-diagnosis/environment.txt
          lscpu >> qa/modal-raster-diagnosis/environment.txt
          free -m >> qa/modal-raster-diagnosis/environment.txt
          cat /proc/self/cgroup >> qa/modal-raster-diagnosis/environment.txt
          for info in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max; do
            if [ -r "$info" ]; then
              printf '%s\n' "$info" >> qa/modal-raster-diagnosis/environment.txt
              cat "$info" >> qa/modal-raster-diagnosis/environment.txt
            else
              printf '%s not exposed by this runner\n' "$info" >> qa/modal-raster-diagnosis/environment.txt
            fi
          done
      - name: Measure browser-default full suite once
        continue-on-error: true
        env:
          QA_TRACE_RASTER: '1'
          QA_OUTPUT_DIR: qa/modal-raster-diagnosis/browser-default
        run: |
          vmstat 1 > qa/modal-raster-diagnosis/browser-default-resources.txt &
          resource_pid=$!
          trap 'kill "$resource_pid" 2>/dev/null || true' EXIT
          timeout --kill-after=10s 240s node site/modal-motion-browser-test.mjs
      - name: Measure CPU DOM raster with unchanged WebGL once
        continue-on-error: true
        env:
          QA_TRACE_RASTER: '1'
          QA_CPU_DOM_RASTER: '1'
          QA_OUTPUT_DIR: qa/modal-raster-diagnosis/cpu-dom-raster
        run: |
          vmstat 1 > qa/modal-raster-diagnosis/cpu-dom-raster-resources.txt &
          resource_pid=$!
          trap 'kill "$resource_pid" 2>/dev/null || true' EXIT
          timeout --kill-after=10s 240s node site/modal-motion-browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modal-raster-diagnosis-${{ github.sha }}
          path: qa/modal-raster-diagnosis/
          retention-days: 30
      - name: Require both measured scopes to satisfy unchanged contracts
        if: always()
        run: |
          node --input-type=module -e "import fs from 'node:fs';for(const scope of ['browser-default','cpu-dom-raster']){const r=JSON.parse(fs.readFileSync('qa/modal-raster-diagnosis/'+scope+'/summary.json'));if(r.status!=='pass')process.exitCode=1;}"

name: Validate and deploy asset gallery
on:
  push:
    branches: [main, 'publish/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
env:
  SITE_BASE: /lowpoly-vault/
  SITE_ORIGIN: https://s010s.github.io
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify exact authorized publication and unchanged originals
        run: npm run publication:check && npm run test:publication
      - run: npm test && npm run test:redesign && npm run test:parser && npm run test:scrub
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify real models, static routes, downloads and mobile layouts
        env:
          GALLERY_DIR: dist
          QA_OUTPUT_DIR: qa/release-strict-gpu
          QA_REQUIRE_COUNT: '10'
          QA_ALLOW_WEBGL_FALLBACK: '0'
        run: node site/redesign-browser-test.mjs
      - name: Verify image-only list scrubbing and automatic real-3D details
        env:
          GALLERY_DIR: dist
          QA_OUTPUT_DIR: qa/image-scrub
        run: npm run test:scrub:browser
      - name: Verify same-angle modal handoff and interrupted history
        env:
          GALLERY_DIR: dist
          QA_OUTPUT_DIR: qa/handoff-continuity
        run: npm run test:handoff:browser
      - name: Verify deliberate WebGL fallback separately
        env:
          GALLERY_DIR: dist
          QA_OUTPUT_DIR: qa/release-fallback-only
          QA_REQUIRE_COUNT: '10'
          QA_ALLOW_WEBGL_FALLBACK: '1'
          QA_FORCE_WEBGL_FALLBACK: '1'
        run: node site/redesign-browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-release-qa
          path: |
            qa/release-strict-gpu/
            qa/release-fallback-only/
            qa/threejs-parser.json
            qa/image-scrub/
            qa/handoff-continuity/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

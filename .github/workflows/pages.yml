name: Validate and deploy asset gallery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-readiness:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for an explicitly generated release manifest
        id: check
        shell: bash
        run: |
          if [ ! -f assets/manifest.json ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Pages skipped: no approved release manifest. Use the Chromium review workflow to inspect the collection." >> "$GITHUB_STEP_SUMMARY"
          else
            python3 -c 'import json; d=json.load(open("assets/manifest.json")); assert not d.get("review_only"), "A review manifest cannot be deployed"'
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: release-readiness
    if: needs.release-readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run manifest:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-qa
          path: qa/screenshots/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

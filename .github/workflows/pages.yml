name: Validate and deploy asset gallery
on:
  push:
    branches: [main, 'publish/**', 'feat/shared-model-preview', 'fix/smooth-hover-reveal-*', 'integrate/small-life-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
env:
  SITE_BASE: /lowpoly-vault/
  SITE_ORIGIN: https://s010s.github.io
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node site/ci-scope-test.mjs
      - name: Verify exact authorized publication and unchanged originals
        run: npm run publication:check && npm run test:publication
      - run: npm run test:manifest && node site/validate.mjs --review && npm run test:catalog && npm run test:theme && npm run test:preview && npm run test:redesign && npm run test:scrub
      - run: npm run build
        id: build_site
      - run: npx playwright install --with-deps chromium
        id: install_chromium
      - name: Parse original and published models, decoding embedded textures in Chromium
        run: npm run test:parser
      - name: Static routes, exact download bytes and attribution for every model
        env:
          GALLERY_DIR: dist
          QA_STATIC_ONLY: '1'
          QA_OUTPUT_DIR: qa/release-static
        run: node site/redesign-browser-test.mjs
      - name: Key keyboard, filter, disclosure and clipboard interactions
        run: npm run test:interaction:browser
      - name: Thumbnail to real 3D and canonical return smoke
        env:
          QA_HANDOFF_SMOKE: '1'
          QA_OUTPUT_DIR: qa/release-handoff-smoke
        run: npm run test:handoff:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-release-qa
          path: |
            qa/release-static/
            qa/release-handoff-smoke/
            qa/animation-refinements/interaction/
            qa/threejs-parser.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    name: Verify deployed Pages in Chromium
    if: needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Actual deployed catalog, direct details, GLB/Blend/ZIP, attribution and previews
        run: node site/live-release-browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-release-browser-${{ github.sha }}
          path: qa/live-fauna-release/

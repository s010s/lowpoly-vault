      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify only the exact fifty-two frozen card inputs
        run: node qa/fifty-two-card-capture-20261021/capture-only-stage.mjs --check
      - name: Bundle the unchanged native card renderer only
        run: node qa/fifty-two-card-capture-20261021/build-card-viewer.mjs
      - name: Stage only the exact fifty-two card subjects
        run: node qa/fifty-two-card-capture-20261021/capture-only-stage.mjs
      - run: npx playwright install --with-deps chromium
      - name: Capture native card PNG references and WebP posters only
        run: node site/render-web-previews.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fifty-two-card-capture
          path: qa/ci-fifty-two-card-capture/cards/
      - run: echo '52 exact native card PNG/WebP pairs only. No gallery pairs, source changes, publication or formal approval.' >> "$GITHUB_STEP_SUMMARY"

name: Capture pinned publication posters
on:
  push:
    branches: ['capture/**']
  pull_request:
    paths:
      - 'qa/landair-release-20261019/capture-inputs.json'
      - 'site/accepted-landair-capture.mjs'
      - 'site/prepare-landair-capture.mjs'
      - 'qa/quartets-release-20261019/capture-inputs.json'
      - 'site/accepted-quartets-capture.mjs'
      - 'site/prepare-quartets-capture.mjs'
      - '.github/workflows/publication-poster-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_BASE: /lowpoly-vault/
      SITE_ORIGIN: https://s010s.github.io
      GALLERY_DIR: qa/capture-inputs-site
      PREVIEW_OUTPUT: qa/ci-publication-capture
      PREVIEW_POSTERS_ONLY: '1'
      CAPTURE_REFERENCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npx vite build --outDir "$GITHUB_WORKSPACE/qa/capture-inputs-site"
      - name: Stage only eight hash-pinned Batch51 and Batch55 candidates
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,writeFile,mkdir,appendFile,realpath} from 'node:fs/promises';
          import {resolve,dirname} from 'node:path';
          import {createHash} from 'node:crypto';
          const descriptor=JSON.parse(await readFile('qa/batches51-55-release-20261020/capture-inputs.json'));
          assert.equal(descriptor.publication_authority,false);assert.equal(descriptor.capture_only,true);
          const exact={"version":1,"capture_only":true,"publication_authority":false,"assets":[{"id":"dicranurus","batch":51,"revision":"r001","source_commit":"9000874083b6a6fb8e4e83dc95e4915801eecff4","review_commit":"925ff855ad0fcc3635cfc44a457101344ffddbde","review":{"path":"qa/batch51-independent-20261019/evidence/results.json","sha256":"b373db93aae4373d761fbfe916999e96def533768fe491deaecf99af93f532f0"},"metadata":{"path":"assets/candidates/continuous-small-life-round17-20261018/batch-51/dicranurus/r001/metadata.json","sha256":"300d2bf2fd13679e872589c45fbc4f3141a11d2179f2e75a3ea15b0cf2712c0c"},"glb":{"path":"assets/candidates/continuous-small-life-round17-20261018/batch-51/dicranurus/r001/dicranurus.glb","sha256":"ffe61e0340399eb1bd41cb198ba5abc20edae439db44e3c21d4cf6d9e032bd65"}},{"id":"calcite-raft-deposit","batch":51,"revision":"r002","source_commit":"9000874083b6a6fb8e4e83dc95e4915801eecff4","review_commit":"925ff855ad0fcc3635cfc44a457101344ffddbde","review":{"path":"qa/batch51-independent-20261019/evidence/results.json","sha256":"b373db93aae4373d761fbfe916999e96def533768fe491deaecf99af93f532f0"},"metadata":{"path":"assets/candidates/continuous-small-life-round17-20261018/batch-51/calcite-raft-deposit/r002/metadata.json","sha256":"0c20fe5c58c8f679eb54db1fa6aad50b1c4620d3e01b53f5bed9bf43c4b3214c"},"glb":{"path":"assets/candidates/continuous-small-life-round17-20261018/batch-51/calcite-raft-deposit/r002/calcite-raft-deposit.glb","sha256":"fdbad4c14684a3af5940199f422ee3c605d00bf997649738a85fe0082eb4fd22"}},{"id":"accretionary-lapilli-bed","batch":51,"revision":"r002","source_commit":"9000874083b6a6fb8e4e83dc95e4915801eecff4","review_commit":"925ff855ad0fcc3635cfc44a457101344ffddbde","review":{"path":"qa/batch51-independent-20261019/evidence/results.json","sha256":"b373db93aae4373d761fbfe916999e96def533768fe491deaecf99af93f532f0"},"metadata":{"path":"assets/candidates/continuous-small-life-round17-20261018/batch-51/accretionary-lapilli-bed/r002/metadata.json","sha256":"294dce68de44b5a05aa3ed45fd69ee8d493d8f3eba311f48e8d9e4e9f90d6217"},"glb":{"path":"assets/candidates/continuous-small-life-round17-20261018/batch-51/accretionary-lapilli-bed/r002/accretionary-lapilli-bed.glb","sha256":"61b2ae162930e8b8221e0f3cad27dd3e044a99ba6883db299dbe041231711cf3"}},{"id":"conichnus-conical-burrow","batch":51,"revision":"r001","source_commit":"9000874083b6a6fb8e4e83dc95e4915801eecff4","review_commit":"925ff855ad0fcc3635cfc44a457101344ffddbde","review":{"path":"qa/batch51-independent-20261019/evidence/results.json","sha256":"b373db93aae4373d761fbfe916999e96def533768fe491deaecf99af93f532f0"},"metadata":{"path":"assets/candidates/continuous-small-life-round17-20261018/batch-51/conichnus-conical-burrow/r001/metadata.json","sha256":"99fadb070a377f891fc1265bfd6902082e35a8f9e8c0e355da0ac555ef2f10ce"},"glb":{"path":"assets/candidates/continuous-small-life-round17-20261018/batch-51/conichnus-conical-burrow/r001/conichnus-conical-burrow.glb","sha256":"34948b0738264195544dd24ff377a1b0f3b92a93a1e34ab07d66647235388042"}},{"id":"vermicularia","batch":55,"revision":"r001","source_commit":"54ca033757bce0d282358e60473e81b8ca4778e1","review_commit":"1cdfab1b0351c61854b5480c8eac012440232fa1","review":{"path":"production/continuous-small-life-round20-20261020/reviews/batch-55-independent-20261020/independent-qa.json","sha256":"a34bb0ab2f412ec9a19708d3a74b8131679f04f40c1867f9dd33e8e6b38a0f97"},"metadata":{"path":"assets/candidates/continuous-small-life-round20-20261020/batch-55/vermicularia/r001/metadata.json","sha256":"499435f6614d4547cab34e47c4c88cd2755c0e30c6fafd0ecb6ac86e01fc1702"},"glb":{"path":"production/continuous-small-life-round20-20261020/work/batch-55/runs/build/vermicularia/r001/initial/d7b9fc38de2015c80d1d7f59be21cdeabe09dc533b18b156a82dacb55f4d2631/20261020T012812-0e1d83ff4cbb40309f851ba7f769a94f/outputs/vermicularia/vermicularia.glb","sha256":"5bb8a455b222496fbe8568184eb2aff11b717aab29bbf42d3138707781b27f7f"}},{"id":"weichselia","batch":55,"revision":"r001","source_commit":"54ca033757bce0d282358e60473e81b8ca4778e1","review_commit":"1cdfab1b0351c61854b5480c8eac012440232fa1","review":{"path":"production/continuous-small-life-round20-20261020/reviews/batch-55-independent-20261020/independent-qa.json","sha256":"a34bb0ab2f412ec9a19708d3a74b8131679f04f40c1867f9dd33e8e6b38a0f97"},"metadata":{"path":"assets/candidates/continuous-small-life-round20-20261020/batch-55/weichselia/r001/metadata.json","sha256":"8466cc47b61284d0a1a6f2ef076ca2a6ae6528a05f56562a814fa77994f31043"},"glb":{"path":"production/continuous-small-life-round20-20261020/work/batch-55/runs/build/weichselia/r001/initial/e5b2824e783f41ff2763c079180136da29ad5689349acaaf7ea775f8f92f36cd/20261020T012806-20a5230bf8164369a8ff0caedc1abdf0/outputs/weichselia/weichselia.glb","sha256":"4ece730443de73b6c2dca2fe2bc7a50517628e344b5e6edd37486901c997676a"}},{"id":"ventifact","batch":55,"revision":"r001","source_commit":"54ca033757bce0d282358e60473e81b8ca4778e1","review_commit":"1cdfab1b0351c61854b5480c8eac012440232fa1","review":{"path":"production/continuous-small-life-round20-20261020/reviews/batch-55-independent-20261020/independent-qa.json","sha256":"a34bb0ab2f412ec9a19708d3a74b8131679f04f40c1867f9dd33e8e6b38a0f97"},"metadata":{"path":"assets/candidates/continuous-small-life-round20-20261020/batch-55/ventifact/r001/metadata.json","sha256":"0033eec290e58bd7756d51d1ce6fa4fd0b990b891dcc328b4b907916d0810fdd"},"glb":{"path":"production/continuous-small-life-round20-20261020/work/batch-55/runs/build/ventifact/r001/initial/d93d9121129e8c3fd0a0ddba24ab0eb2861836e6b3236aec22c88b9f7000ddf0/20261020T012756-c17d8a3eb55b4a7d8c8dc310513652e8/outputs/ventifact/ventifact.glb","sha256":"291ad1bbff024594c61ad218ea4fc33add08425d2998fbec20051de8abad64fa"}},{"id":"pentichnus-deep-dwelling-trace","batch":55,"revision":"r002","source_commit":"54ca033757bce0d282358e60473e81b8ca4778e1","review_commit":"1cdfab1b0351c61854b5480c8eac012440232fa1","review":{"path":"production/continuous-small-life-round20-20261020/reviews/batch-55-independent-20261020/independent-qa.json","sha256":"a34bb0ab2f412ec9a19708d3a74b8131679f04f40c1867f9dd33e8e6b38a0f97"},"metadata":{"path":"assets/candidates/continuous-small-life-round20-20261020/batch-55/pentichnus-deep-dwelling-trace/r002/metadata.json","sha256":"da84e300aabcd7a64cd25fcfc68314fa8d01df96d9d2c4e930aff8caed0e224e"},"glb":{"path":"production/continuous-small-life-round20-20261020/work/batch-55/runs/build/pentichnus-deep-dwelling-trace/r002/initial/91de28c949a1c703e228d34d7add3f06c13e7623fd403658ed00a342d96b0c39/20261020T012908-00e71f859eb34a4687549d4baa089310/outputs/pentichnus-deep-dwelling-trace/pentichnus-deep-dwelling-trace.glb","sha256":"aefb89b47511df9534a02af61e0d96c77bafc34c2646eb295891bc2104cc59f9"}}]};
          assert.deepEqual(descriptor,exact);
          async function checked(pin){assert(/^(assets\/candidates|qa|production)\/[a-zA-Z0-9_./-]+$/.test(pin.path)&&!pin.path.split('/').includes('..'));const p=resolve(pin.path);assert.equal(await realpath(p),p);const b=await readFile(p);assert.equal(createHash('sha256').update(b).digest('hex'),pin.sha256);return b;}
          const assets=[];
          for(const entry of descriptor.assets){const a=JSON.parse(await checked(entry.metadata)),b=await checked(entry.glb),reviewBytes=await checked(entry.review);assert.equal(a.id,entry.id);assert.equal(a.glb,entry.glb.path);assert.equal(a.sha256.glb,entry.glb.sha256);
          assert(reviewBytes.includes(Buffer.from(entry.id))); // Exact review bytes are pinned; capture does not grant acceptance.
          const target=resolve(process.env.GALLERY_DIR,a.glb);await mkdir(dirname(target),{recursive:true});await writeFile(target,b);const captureAsset={...a};delete captureAsset.revision;delete captureAsset.revision_provenance;assets.push(captureAsset);}
          assert.equal(assets.length,8);await mkdir(resolve(process.env.GALLERY_DIR,'assets'),{recursive:true});await writeFile(resolve(process.env.GALLERY_DIR,'assets/manifest.json'),JSON.stringify({capture_only:true,publication_authority:false,assets}));await appendFile(process.env.GITHUB_ENV,`PREVIEW_ASSET_IDS=${assets.map(a=>a.id).join(',')}\n`);
          JS
      - run: npx playwright install --with-deps chromium
      - run: node site/render-web-previews.mjs
      - name: Verify eight capture outputs
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";import {readFile} from "node:fs/promises";import {createHash} from "node:crypto";const r=JSON.parse(await readFile("qa/ci-publication-capture/render-report.json"));const d=JSON.parse(await readFile("qa/batches51-55-release-20261020/capture-inputs.json"));assert.equal(r.status,"pass");assert.equal(r.chromium_version,r.pinned_chromium_version);assert.deepEqual(r.assets.map(x=>x.id).sort(),d.assets.map(x=>x.id).sort());for(const a of d.assets){assert.equal(r.assets.find(x=>x.id===a.id).source_glb_sha256,a.glb.sha256);}console.log("Eight exact-source website captures verified; publication authority remains false.");
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-publication-capture
          path: qa/ci-publication-capture/
      - name: State capture scope
        run: echo 'Capture-only public image generation. Publication tests, exact poster reproduction, full review, Pages and live browser gates remain required separately.' >> "$GITHUB_STEP_SUMMARY"

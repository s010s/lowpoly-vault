name: Capture pinned publication posters
on:
  push:
    branches: ['capture/**']
  pull_request:
    paths:
      - 'qa/landair-release-20261019/capture-inputs.json'
      - 'site/accepted-landair-capture.mjs'
      - 'site/prepare-landair-capture.mjs'
      - 'qa/quartets-release-20261019/capture-inputs.json'
      - 'site/accepted-quartets-capture.mjs'
      - 'site/prepare-quartets-capture.mjs'
      - '.github/workflows/publication-poster-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_BASE: /lowpoly-vault/
      SITE_ORIGIN: https://s010s.github.io
      GALLERY_DIR: qa/capture-inputs-site
      PREVIEW_OUTPUT: qa/ci-publication-capture
      PREVIEW_POSTERS_ONLY: '1'
      CAPTURE_REFERENCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npx vite build --outDir "$GITHUB_WORKSPACE/qa/capture-inputs-site"
      - name: Stage only eight hash-pinned Batch52 and Batch53 candidates
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,writeFile,mkdir,appendFile,realpath} from 'node:fs/promises';
          import {resolve,dirname} from 'node:path';
          import {createHash} from 'node:crypto';
          const descriptor=JSON.parse(await readFile('qa/batches52-53-release-20261020/capture-inputs.json'));
          assert.equal(descriptor.publication_authority,false);assert.equal(descriptor.capture_only,true);
          const exact={"version":1,"capture_only":true,"publication_authority":false,"assets":[{"id":"aturia","batch":52,"revision":"r003","source_commit":"110ec9772e1854ab9c4ccfa23848541b8e3aa1d7","review_commit":"cd53a96b93f7cd513163ade75afe9855237fcd8b","review":{"path":"qa/batch52-aturia-r003-diff-20261020/review-evidence.json","sha256":"0de129c580b0dbfa7dc65128f1cbdc3c411958507e4b9148e5f42f20d34f0954"},"metadata":{"path":"assets/candidates/continuous-small-life-round18-20261020/batch-52/aturia/r003/metadata.json","sha256":"aee6108b2f4cff5414352de619a3036f52cf85d829c9fd9f4bc460dbe51cc6b8"},"glb":{"path":"assets/candidates/continuous-small-life-round18-20261020/batch-52/aturia/r003/aturia.glb","sha256":"74b4e090382777b9d8b358dd1dad2df57f9751d8266437e95d9d144448cf31d1"}},{"id":"cave-popcorn","batch":52,"revision":"r003","source_commit":"110ec9772e1854ab9c4ccfa23848541b8e3aa1d7","review_commit":"f3f793f6f9024d43453dbd302623c98eb34af5e7","review":{"path":"qa/batch52-independent-20261020/review-evidence.json","sha256":"3331497ea393fb9dce15eae7449f26f65f95172b73f79a1d6b8779d571f8afc7"},"metadata":{"path":"assets/candidates/continuous-small-life-round18-20261020/batch-52/cave-popcorn/r003/metadata.json","sha256":"f8af1bac3b25830c60706a1e5b8c11dbbb0e954e6ca2b0a8a871aaeb9acf56f5"},"glb":{"path":"assets/candidates/continuous-small-life-round18-20261020/batch-52/cave-popcorn/r003/cave-popcorn.glb","sha256":"36439f98c26784601b24ba4ac18c709f51c3ef9b071e0225438aaec42b7ba85b"}},{"id":"curvolithus-trilobed-trail","batch":52,"revision":"r001","source_commit":"110ec9772e1854ab9c4ccfa23848541b8e3aa1d7","review_commit":"f3f793f6f9024d43453dbd302623c98eb34af5e7","review":{"path":"qa/batch52-independent-20261020/review-evidence.json","sha256":"3331497ea393fb9dce15eae7449f26f65f95172b73f79a1d6b8779d571f8afc7"},"metadata":{"path":"assets/candidates/continuous-small-life-round18-20261020/batch-52/curvolithus-trilobed-trail/r001/metadata.json","sha256":"62b7a607b68be7954063df24f27d23569f516e3eb815f24a2bcb726955e74e60"},"glb":{"path":"assets/candidates/continuous-small-life-round18-20261020/batch-52/curvolithus-trilobed-trail/r001/curvolithus-trilobed-trail.glb","sha256":"c07529a8856b679af1a1d3e816c37046076488ee926f7e38e70241f0cbefed22"}},{"id":"phoenicopsis","batch":52,"revision":"r001","source_commit":"110ec9772e1854ab9c4ccfa23848541b8e3aa1d7","review_commit":"f3f793f6f9024d43453dbd302623c98eb34af5e7","review":{"path":"qa/batch52-independent-20261020/review-evidence.json","sha256":"3331497ea393fb9dce15eae7449f26f65f95172b73f79a1d6b8779d571f8afc7"},"metadata":{"path":"assets/candidates/continuous-small-life-round18-20261020/batch-52/phoenicopsis/r001/metadata.json","sha256":"21bc06dd8b83fa435afaac4401c22638b05aad00510405e092cc776a3c27e193"},"glb":{"path":"assets/candidates/continuous-small-life-round18-20261020/batch-52/phoenicopsis/r001/phoenicopsis.glb","sha256":"7e7fa939eeca8d1d0571ae1724faa7fa2387f03441bf0794fe4b269d666182d0"}},{"id":"halopoa-furrowed-burrow","batch":53,"revision":"r001","source_commit":"0d4d6153955b2ca8809d343d63628f55b493b074","review_commit":"19bf7332eb3cf5138a8b91820d495599f790d727","review":{"path":"qa/continuous-small-life-round18-20261020/batch-53/INDEPENDENT-REVIEW.md","sha256":"495ac88acb3002de206a84dcd383206d7b67c5c7a7da7f4c553fa6f8d45ac2c1"},"metadata":{"path":"assets/candidates/continuous-small-life-round18-20261020/batch-53/halopoa-furrowed-burrow/r001/metadata.json","sha256":"01bf918df84837da1dae0bd14490d07dfacd9991aec8b2156e37179ed40adb47"},"glb":{"path":"assets/candidates/continuous-small-life-round18-20261020/batch-53/halopoa-furrowed-burrow/r001/halopoa-furrowed-burrow.glb","sha256":"42e7fd3105d689c27d3bdf7de6ea0fbfc95094d0645e840b1b66062ca8fd54f6"}},{"id":"hypoturrilites","batch":53,"revision":"r001","source_commit":"0d4d6153955b2ca8809d343d63628f55b493b074","review_commit":"19bf7332eb3cf5138a8b91820d495599f790d727","review":{"path":"qa/continuous-small-life-round18-20261020/batch-53/INDEPENDENT-REVIEW.md","sha256":"495ac88acb3002de206a84dcd383206d7b67c5c7a7da7f4c553fa6f8d45ac2c1"},"metadata":{"path":"assets/candidates/continuous-small-life-round18-20261020/batch-53/hypoturrilites/r001/metadata.json","sha256":"c1f79f94056ed6a401f7b1552d7847befc1adf0da58b65c7a1a35f5f5f728277"},"glb":{"path":"assets/candidates/continuous-small-life-round18-20261020/batch-53/hypoturrilites/r001/hypoturrilites.glb","sha256":"23d62a058ebc966e287d6a70feec6c041e30a4c2314418e7504ca59258d56bc1"}},{"id":"iodes-brownii","batch":53,"revision":"r001","source_commit":"0d4d6153955b2ca8809d343d63628f55b493b074","review_commit":"19bf7332eb3cf5138a8b91820d495599f790d727","review":{"path":"qa/continuous-small-life-round18-20261020/batch-53/INDEPENDENT-REVIEW.md","sha256":"495ac88acb3002de206a84dcd383206d7b67c5c7a7da7f4c553fa6f8d45ac2c1"},"metadata":{"path":"assets/candidates/continuous-small-life-round18-20261020/batch-53/iodes-brownii/r001/metadata.json","sha256":"66449e3ced5d9a08ea61f30e22a21b61dfcc36dd8fb9fa6a2039e034b16975bd"},"glb":{"path":"assets/candidates/continuous-small-life-round18-20261020/batch-53/iodes-brownii/r001/iodes-brownii.glb","sha256":"f3604fbfab6eb74df9dfc6924994e642dc9722681a3329a91f21c0d42c997dff"}},{"id":"welded-ignimbrite-outcrop","batch":53,"revision":"r001","source_commit":"0d4d6153955b2ca8809d343d63628f55b493b074","review_commit":"19bf7332eb3cf5138a8b91820d495599f790d727","review":{"path":"qa/continuous-small-life-round18-20261020/batch-53/INDEPENDENT-REVIEW.md","sha256":"495ac88acb3002de206a84dcd383206d7b67c5c7a7da7f4c553fa6f8d45ac2c1"},"metadata":{"path":"assets/candidates/continuous-small-life-round18-20261020/batch-53/welded-ignimbrite-outcrop/r001/metadata.json","sha256":"481b3e82e69a7b62825ace8559cad5857dd7a83ac3cb5211d7705d7e1adb62bc"},"glb":{"path":"assets/candidates/continuous-small-life-round18-20261020/batch-53/welded-ignimbrite-outcrop/r001/welded-ignimbrite-outcrop.glb","sha256":"83b7d4170c8cb51870e2ea643294306e4cc6a62a2386712457cfb887ff0c2704"}}]};
          assert.deepEqual(descriptor,exact);
          async function checked(pin){assert(/^(assets\/candidates|qa)\/[a-zA-Z0-9_./-]+$/.test(pin.path)&&!pin.path.split('/').includes('..'));const p=resolve(pin.path);assert.equal(await realpath(p),p);const b=await readFile(p);assert.equal(createHash('sha256').update(b).digest('hex'),pin.sha256);return b;}
          const assets=[];
          for(const entry of descriptor.assets){const a=JSON.parse(await checked(entry.metadata)),b=await checked(entry.glb),reviewBytes=await checked(entry.review);assert.equal(a.id,entry.id);assert.equal(a.glb,entry.glb.path);assert.equal(a.sha256.glb,entry.glb.sha256);
          if(entry.id==='aturia'){const r=JSON.parse(reviewBytes);assert.equal(r.artifact.glb_sha256,entry.glb.sha256);assert.equal(r.original_finding.r003_retest,'pass_finding_closed');assert.equal(r.scope.repair_candidate_commit,entry.source_commit);}
          else if(entry.batch===52){const r=JSON.parse(reviewBytes).verdicts[entry.id];assert.equal(r.glb_sha256,entry.glb.sha256);assert.equal(r.technical,entry.id==='curvolithus-trilobed-trail'?'pass_with_reviewed_source_style_warning':'pass');assert.equal(r.specification,'pass');assert(r.visual.startsWith('pass'));}
          else {const r=reviewBytes.toString();assert(r.includes(entry.glb.sha256));assert(r.includes(entry.source_commit));assert(r.includes('Asset-level technical, specification, visual, and factual review passed for all four frozen r001 assets.'));}
          const target=resolve(process.env.GALLERY_DIR,a.glb);await mkdir(dirname(target),{recursive:true});await writeFile(target,b);const captureAsset={...a};delete captureAsset.revision;delete captureAsset.revision_provenance;assets.push(captureAsset);}
          assert.equal(assets.length,8);await mkdir(resolve(process.env.GALLERY_DIR,'assets'),{recursive:true});await writeFile(resolve(process.env.GALLERY_DIR,'assets/manifest.json'),JSON.stringify({capture_only:true,publication_authority:false,assets}));await appendFile(process.env.GITHUB_ENV,`PREVIEW_ASSET_IDS=${assets.map(a=>a.id).join(',')}\n`);
          JS
      - run: npx playwright install --with-deps chromium
      - run: node site/render-web-previews.mjs
      - name: Verify eight capture outputs
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";import {readFile} from "node:fs/promises";import {createHash} from "node:crypto";const r=JSON.parse(await readFile("qa/ci-publication-capture/render-report.json"));const d=JSON.parse(await readFile("qa/batches52-53-release-20261020/capture-inputs.json"));assert.equal(r.status,"pass");assert.equal(r.chromium_version,r.pinned_chromium_version);assert.deepEqual(r.assets.map(x=>x.id).sort(),d.assets.map(x=>x.id).sort());for(const a of d.assets){assert.equal(r.assets.find(x=>x.id===a.id).source_glb_sha256,a.glb.sha256);}console.log("Eight exact-source website captures verified; publication authority remains false.");
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-publication-capture
          path: qa/ci-publication-capture/
      - name: State capture scope
        run: echo 'Capture-only public image generation. Publication tests, exact poster reproduction, full review, Pages and live browser gates remain required separately.' >> "$GITHUB_STEP_SUMMARY"

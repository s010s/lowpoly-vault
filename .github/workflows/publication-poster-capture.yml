name: Capture pinned publication posters
on:
  push:
    branches: ['capture/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Capture only seven exact gallery pairs
        run: node qa/batches5859-gallery-capture/scoped-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batches5859-gallery-pairs
          path: qa/ci-batches5859-gallery/
      - run: echo 'Seven capture-only gallery pairs; no production, cache-policy or formal approval change.' >> "$GITHUB_STEP_SUMMARY"

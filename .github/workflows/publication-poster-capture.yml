name: Capture pinned publication posters
on:
  push:
    branches: ['capture/**']
  pull_request:
    paths:
      - 'qa/landair-release-20261019/capture-inputs.json'
      - 'site/accepted-landair-capture.mjs'
      - 'site/prepare-landair-capture.mjs'
      - 'qa/quartets-release-20261019/capture-inputs.json'
      - 'site/accepted-quartets-capture.mjs'
      - 'site/prepare-quartets-capture.mjs'
      - '.github/workflows/publication-poster-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_BASE: /lowpoly-vault/
      SITE_ORIGIN: https://s010s.github.io
      GALLERY_DIR: qa/capture-inputs-site
      PREVIEW_OUTPUT: qa/ci-publication-capture
      PREVIEW_POSTERS_ONLY: '1'
      CAPTURE_REFERENCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npx vite build --outDir "$GITHUB_WORKSPACE/qa/capture-inputs-site"
      - name: Prepare reviewed land-air candidate capture inputs
        if: hashFiles('qa/landair-release-20261019/capture-inputs.json') != ''
        run: node site/prepare-landair-capture.mjs
      - name: Prepare reviewed candidate capture inputs
        if: hashFiles('qa/landair-release-20261019/capture-inputs.json') == '' && hashFiles('qa/quartets-release-20261019/capture-inputs.json') != ''
        run: node site/prepare-quartets-capture.mjs
      - name: Prepare checked capture inputs
        if: hashFiles('qa/landair-release-20261019/capture-inputs.json') == '' && hashFiles('qa/quartets-release-20261019/capture-inputs.json') == ''
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {appendFile} from 'node:fs/promises';
          import {resolve} from 'node:path';
          import {prepareRenderCapture} from './site/prepare-render-capture.mjs';
          import {CONCEPT_SEVEN_IDS} from './site/concept-seven-release.mjs';
          const manifest=await prepareRenderCapture({outDir:resolve(process.env.GALLERY_DIR)});
          const pack=manifest.assets.at(-1).packs[0];
          const ids=manifest.assets.filter(a=>a.packs.includes(pack)).map(a=>a.id);
          if(manifest.publication?.approved_concept_seven_ids){
            assert.deepEqual(ids.slice().sort(),CONCEPT_SEVEN_IDS);
            assert.deepEqual(manifest.publication.approved_concept_seven_ids,CONCEPT_SEVEN_IDS);
          }else{assert.equal(ids.length,12);assert.equal(new Set(ids).size,12);}
          await appendFile(process.env.GITHUB_ENV,`PREVIEW_ASSET_IDS=${ids.join(',')}\n`);
          JS
      - run: npx playwright install --with-deps chromium
      - run: node site/render-web-previews.mjs
      - run: node site/export-captured-posters.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-publication-capture
          path: qa/ci-publication-capture/
      - name: State capture scope
        run: echo 'Capture-only public image generation. Publication tests, exact poster reproduction, full review, Pages and live browser gates remain required separately.' >> "$GITHUB_STEP_SUMMARY"

name: Capture pinned publication posters
on:
  push:
    branches: ['capture/**']
  pull_request:
    paths:
      - 'qa/landair-release-20261019/capture-inputs.json'
      - 'site/accepted-landair-capture.mjs'
      - 'site/prepare-landair-capture.mjs'
      - 'qa/quartets-release-20261019/capture-inputs.json'
      - 'site/accepted-quartets-capture.mjs'
      - 'site/prepare-quartets-capture.mjs'
      - '.github/workflows/publication-poster-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_BASE: /lowpoly-vault/
      SITE_ORIGIN: https://s010s.github.io
      GALLERY_DIR: qa/capture-inputs-site
      PREVIEW_OUTPUT: qa/ci-publication-capture
      PREVIEW_POSTERS_ONLY: '1'
      CAPTURE_REFERENCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npx vite build --outDir "$GITHUB_WORKSPACE/qa/capture-inputs-site"
      - name: Stage only seven exact Batch56 and Batch57 inputs
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,writeFile,mkdir,appendFile,realpath} from 'node:fs/promises';
          import {resolve,dirname} from 'node:path';
          import {createHash} from 'node:crypto';
          const pins={"qa/batch56-release-20261020/capture-inputs.json": "c27a8df2d16f5a06321b49c4eaee36a7fca7f0ec3132745157690d70ea9ded80", "qa/batch57-release-20261020/capture-inputs.json": "bbb0b3f18d79d34c236b6239dec60e51da1f2c163962ffd5e1a96047aaa035fb"};
          async function checked(pin){assert(/^(assets|qa)\/[a-zA-Z0-9_./-]+$/.test(pin.path)&&!pin.path.split('/').includes('..'));const p=resolve(pin.path);assert.equal(await realpath(p),p);const b=await readFile(p);assert.equal(createHash('sha256').update(b).digest('hex'),pin.sha256);return b;}
          const assets=[];
          for(const [path,sha256] of Object.entries(pins)){
           const d=JSON.parse(await checked({path,sha256}));assert.equal(d.publication_authority,false);assert.equal(d.capture_status,'not_run');
           for(const review of d.review_reports)await checked(review);
           for(const e of d.assets){const a=JSON.parse(await checked(e.metadata)),b=await checked(e.glb);assert.equal(a.id,e.id);assert.equal(a.glb,e.glb.path);assert.equal(a.sha256.glb,e.glb.sha256);const target=resolve(process.env.GALLERY_DIR,a.glb);await mkdir(dirname(target),{recursive:true});await writeFile(target,b);assets.push(a);}
          }
          assert.deepEqual(assets.map(a=>a.id).sort(),['arthrophycus-annulated-burrow','cave-column','cycadeoidea','deflation-hollow','gondwanagaricites','quatsinoporites','rusophycus-resting-excavation']);
          await mkdir(resolve(process.env.GALLERY_DIR,'assets'),{recursive:true});
          await writeFile(resolve(process.env.GALLERY_DIR,'assets/manifest.json'),JSON.stringify({capture_only:true,publication_authority:false,assets}));
          await appendFile(process.env.GITHUB_ENV,`PREVIEW_ASSET_IDS=${assets.map(a=>a.id).join(',')}\n`);
          JS
      - run: npx playwright install --with-deps chromium
      - run: node site/render-web-previews.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-publication-capture
          path: qa/ci-publication-capture/
      - name: State capture scope
        run: echo 'Capture-only public image generation. Publication tests, exact poster reproduction, full review, Pages and live browser gates remain required separately.' >> "$GITHUB_STEP_SUMMARY"

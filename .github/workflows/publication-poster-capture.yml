name: Capture pinned publication posters
on:
  push:
    branches: ['capture/**']
  pull_request:
    paths:
      - 'qa/landair-release-20261019/capture-inputs.json'
      - 'site/accepted-landair-capture.mjs'
      - 'site/prepare-landair-capture.mjs'
      - 'qa/quartets-release-20261019/capture-inputs.json'
      - 'site/accepted-quartets-capture.mjs'
      - 'site/prepare-quartets-capture.mjs'
      - '.github/workflows/publication-poster-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_BASE: /lowpoly-vault/
      SITE_ORIGIN: https://s010s.github.io
      GALLERY_DIR: qa/capture-inputs-site
      PREVIEW_OUTPUT: qa/ci-publication-capture
      PREVIEW_POSTERS_ONLY: '1'
      CAPTURE_REFERENCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npx vite build --outDir "$GITHUB_WORKSPACE/qa/capture-inputs-site"
      - name: Stage only four hash-pinned Batch54 candidates
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,writeFile,mkdir,appendFile,realpath} from 'node:fs/promises';
          import {resolve,dirname} from 'node:path';
          import {createHash} from 'node:crypto';
          const descriptor=JSON.parse(await readFile('qa/batch54-release-20261020/capture-inputs.json'));
          assert.equal(descriptor.publication_authority,false);
          assert.equal(descriptor.source_commit,'54d5380ec3c63ae3e9ab4f36cb377db65ab16c75');
          assert.equal(descriptor.review_commit,'d5b0956916ab21d1ef0fef44a42358b3d9c2db95');
          assert.deepEqual(descriptor.assets.map(a=>a.id).sort(),['cave-shield','didymoceras','psammichnites-ribbon-trace','spirematospermum']);
          async function checked(pin){assert(/^(assets\/candidates|qa)\/[a-zA-Z0-9_./-]+$/.test(pin.path)&&!pin.path.split('/').includes('..'));const p=resolve(pin.path);assert.equal(await realpath(p),p);const b=await readFile(p);assert.equal(createHash('sha256').update(b).digest('hex'),pin.sha256);return b;}
          const review=JSON.parse(await checked(descriptor.review));
          assert.equal(review.source.candidate_commit,descriptor.source_commit);
          const assets=[];
          for(const entry of descriptor.assets){const a=JSON.parse(await checked(entry.metadata)),b=await checked(entry.glb);assert.equal(a.id,entry.id);assert.equal(a.glb,entry.glb.path);assert.equal(a.sha256.glb,entry.glb.sha256);assert.equal(review.source.assets.find(x=>x.asset_id===entry.id).hash_pins.glb.sha256,entry.glb.sha256);const target=resolve(process.env.GALLERY_DIR,a.glb);await mkdir(dirname(target),{recursive:true});await writeFile(target,b);assets.push(a);}
          await mkdir(resolve(process.env.GALLERY_DIR,'assets'),{recursive:true});
          await writeFile(resolve(process.env.GALLERY_DIR,'assets/manifest.json'),JSON.stringify({capture_only:true,publication_authority:false,assets}));
          await appendFile(process.env.GITHUB_ENV,`PREVIEW_ASSET_IDS=${assets.map(a=>a.id).join(',')}\n`);
          JS
      - run: npx playwright install --with-deps chromium
      - run: node site/render-web-previews.mjs
      - run: node site/export-captured-posters.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-publication-capture
          path: qa/ci-publication-capture/
      - name: State capture scope
        run: echo 'Capture-only public image generation. Publication tests, exact poster reproduction, full review, Pages and live browser gates remain required separately.' >> "$GITHUB_STEP_SUMMARY"

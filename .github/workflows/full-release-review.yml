name: Read-only proof transport diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: diagnostics
      - name: Preserve the diagnostic outside the inspected source
        run: cp -R diagnostics "$RUNNER_TEMP/proof-transport-diagnostic"
      - uses: actions/checkout@v4
        with:
          ref: c8714ec3eba2925d1669663556445f8c43e40030
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: ''
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Observe unchanged clients with the actual read-only Actions token
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_BASE: /lowpoly-vault/
          SITE_ORIGIN: https://s010s.github.io
        run: node "$RUNNER_TEMP/proof-transport-diagnostic/proof-transport.mjs"
      - name: Save sanitized observations, never a release proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-only-proof-transport-observations
          path: ${{ runner.temp }}/proof-transport-observations.json
          if-no-files-found: warn

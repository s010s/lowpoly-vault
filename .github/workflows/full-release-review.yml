name: Full release review
on:
  workflow_run:
    workflows: ['Validate and deploy asset gallery']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: post-release-review-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true
env:
  SITE_BASE: /lowpoly-vault/
  SITE_ORIGIN: https://s010s.github.io
  QA_PARSER_OUTPUT: qa/ci-parser/threejs-parser.json
jobs:
  deployed-runtime:
    name: Independent post-deployment browser checks
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      POST_RELEASE_SCOPE: qa/post-release-scope/plan.json
      DEPLOYMENT_RECEIPT: qa/deployment-receipt/receipt.json
    steps:
      - uses: actions/checkout@v4
        id: checkout
        if: github.event.workflow_run.conclusion == 'success'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        id: setup
        if: success() && github.event.workflow_run.conclusion == 'success'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
        id: dependencies
        if: success() && github.event.workflow_run.conclusion == 'success'
      - uses: actions/download-artifact@v4
        id: receipt
        if: success() && github.event.workflow_run.conclusion == 'success'
        with:
          name: successful-deployment-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: qa/deployment-receipt/
      - uses: actions/download-artifact@v4
        id: scope
        if: success() && github.event.workflow_run.conclusion == 'success'
        with:
          name: post-release-scope-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: qa/post-release-scope/
      - uses: actions/download-artifact@v4
        id: build
        if: success() && github.event.workflow_run.conclusion == 'success'
        with:
          name: post-release-built-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: dist/
      - name: Reject changed deployment event, original base, subject, selection or hashes
        id: verify
        if: success() && github.event.workflow_run.conclusion == 'success'
        run: node site/ci-layered-release-scope.mjs verify "$POST_RELEASE_SCOPE"
      - run: node site/ci-install-chromium.mjs
        id: install
        if: success() && steps.verify.outcome == 'success'
      - name: Runtime entry lifecycle and thumbnail transition regressions
        id: runtime_regression
        if: always() && steps.verify.outcome == 'success' && steps.install.outcome == 'success'
        env:
          QA_OUTPUT_DIR: qa/post-release-browser-regression
        run: node site/ci-post-release-browser-test.mjs
      - name: Actual deployment URL, commit, entry JS and selected-model acceptance
        id: browser
        if: always() && steps.verify.outcome == 'success' && steps.install.outcome == 'success'
        run: node site/ci-post-release-browser.mjs
      - name: Independent shared-code regressions on the exact downloaded build
        id: shared
        if: always() && steps.verify.outcome == 'success' && steps.install.outcome == 'success'
        run: node site/ci-post-release-shared.mjs
      - name: Actual public right poster and native first-frame parity on authenticated deployed build
        id: right_detail
        if: always() && steps.verify.outcome == 'success' && steps.install.outcome == 'success'
        env:
          DETAIL_BROWSER_TARGET: public
          QA_OUTPUT_DIR: qa/detail-browser-public
        run: |
          DETAIL_BROWSER_PROFILE=full264-v2 node site/detail-presentation-browser-test.mjs
          DETAIL_BROWSER_PROFILE=full264-v2 node site/detail-presentation-browser-test.mjs --verify-evidence
      - name: Always summarize every prerequisite and runtime outcome
        id: summary
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          python3 - <<'PY_SUMMARY'
          import json, os, pathlib
          e = os.environ
          steps = json.loads(e['STEP_OUTCOMES'])
          names = ['checkout', 'setup', 'dependencies', 'receipt', 'scope', 'build', 'verify', 'install', 'runtime_regression', 'browser', 'shared', 'right_detail']
          outcomes = {name: steps.get(name, {}).get('outcome', 'NOT_RUN') for name in names}
          failed = [name for name, outcome in outcomes.items() if outcome in ['failure', 'cancelled']]
          passed = e['UPSTREAM_CONCLUSION'] == 'success' and all(value == 'success' for value in outcomes.values())
          report = {'status': 'PASS' if passed else 'FAIL' if failed else 'NOT_RUN', 'expected_source': e['DEPLOYED_SHA'], 'expected_run_id': e['UPSTREAM_RUN_ID'], 'expected_run_attempt': e['UPSTREAM_RUN_ATTEMPT'], 'upstream_conclusion': e['UPSTREAM_CONCLUSION'], 'failed_phase': failed[0] if failed else None, 'step_outcomes': outcomes, 'runtime_regression': outcomes['runtime_regression'], 'downstream': {name: outcomes[name] if outcomes[name] == 'success' else 'NOT_RUN' if outcomes[name] in ['skipped', 'NOT_RUN'] else 'FAIL' for name in ['browser', 'shared', 'right_detail']}, 'production_acceptance': False, 'reusable_browser_proof': False}
          target = pathlib.Path(e['RUNNER_TEMP']) / 'post-release-summary' / 'report.json'
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          with open(e['GITHUB_STEP_SUMMARY'], 'a') as f: f.write('Post-release results: ' + json.dumps(report) + '\n')
          PY_SUMMARY
      - uses: actions/upload-artifact@v4
        id: report_upload
        if: always()
        with:
          name: post-release-runtime-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/post-release-summary/
            qa/post-release-preflight/
            qa/post-release-runtime/
            qa/post-release-browser-regression/
            qa/post-release-shared/
            qa/detail-browser-public/
            qa/approved-gallery-browser/
            qa/brand-browser/
            qa/release-*/
            qa/continuous-release-*/
          if-no-files-found: error
      - name: Explicitly retain artifact upload failures
        if: always()
        env:
          REPORT_UPLOAD: ${{ steps.report_upload.outcome }}
        run: |
          echo "Runtime artifact upload: $REPORT_UPLOAD" >> "$GITHUB_STEP_SUMMARY"
          test "$REPORT_UPLOAD" = success
  # Explicit dispatch retains the historical complete browser/proof audit path.
  scope:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      models: ${{ steps.scope.outputs.models }}
      previews: ${{ steps.scope.outputs.previews }}
      ids: ${{ steps.scope.outputs.ids }}
      tasks: ${{ steps.scope.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_REVIEW: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: node site/ci-scope.mjs
      - name: Record independently verifiable PR source
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node site/ci-provenance.mjs review
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: validated-review-${{ github.run_attempt }}
          path: qa/ci-provenance/review/
          if-no-files-found: error
  prepare-source:
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    needs: scope
    if: needs.scope.outputs.tasks != '["none"]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set isolated publication memo path
        run: echo "CI_PUBLICATION_RECEIPT=$RUNNER_TEMP/publication-${GITHUB_RUN_ID}-${GITHUB_JOB}.json" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Validate source contracts once before all proof consumers
        run: node site/ci-browser-task-proof-test.mjs && node site/ci-additions-browser-contract-test.mjs && node site/ci-install-chromium-test.mjs && node site/ci-clean-gallery-test.mjs && node site/ci-archival-inputs-test.mjs && node site/ci-archival-models-test.mjs && node site/catalog-data-test.mjs && node site/ci-card-preview-proof-test.mjs && node site/ci-model-proof-test.mjs && node site/ci-model-cache-test.mjs && node site/ci-incremental-archive-test.mjs && node site/ci-incremental-models-test.mjs && node site/ci-scope-test.mjs && node site/ci-model-shards-test.mjs && node site/ci-provenance-test.mjs && node site/ci-reuse-integration-test.mjs && node site/ci-publication-test.mjs && node site/ci-poster-inputs-test.mjs && node site/ci-poster-approval-test.mjs && node site/ci-gallery-poster-cache-test.mjs && node site/ci-timed-test.mjs && node site/ci-scene-input-test.mjs
      - name: Brand source contracts when present
        run: if [ -f site/brand-test.mjs ]; then node site/brand-test.mjs; fi
      - name: Authenticate and validate right delivery before full-release publication proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node site/detail-presentation-contract.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: raw-full-review-built-site
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: raw-full-review-render-template
          path: qa/ci-model-proof/vite-template.html
          if-no-files-found: error
  prepare:
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      tasks: ${{ steps.model_plan.outputs.tasks }}
      fresh_ids: ${{ steps.model_plan.outputs.fresh_ids }}
      fresh_count: ${{ steps.model_plan.outputs.fresh_count }}
      reused_count: ${{ steps.model_plan.outputs.reused_count }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    needs: [scope, prepare-source]
    if: needs.scope.outputs.tasks != '["none"]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: raw-full-review-built-site
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: raw-full-review-render-template
          path: qa/ci-model-proof/
      - name: Check exact source-bound inputs before clean gallery capture
        run: node site/ci-clean-gallery.mjs
      - run: node site/ci-install-chromium.mjs
      - name: Complete the exact gallery in a collector-free proof runner
        env:
          CI_GALLERY_PROOF_DIR: qa/ci-gallery-proof
        run: npm run gallery:posters && node site/gallery-assets.mjs --dist --complete
      - name: Independently plan exact fresh and reused model evidence
        id: model_plan
        env:
          CI_REVIEW_TASKS: ${{ needs.scope.outputs.tasks }}
          FULL_REVIEW: ${{ github.event_name == 'workflow_dispatch' }}
        run: node site/ci-incremental-models.mjs plan
      - uses: actions/upload-artifact@v4
        with:
          name: exact-model-plan
          path: qa/ci-model-proof/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-poster-proof-v1-${{ github.run_attempt }}
          path: qa/ci-gallery-proof/
          if-no-files-found: error
      - name: Bind shared build bytes to source and validation policy
        run: node site/ci-model-shards.mjs seal-build
      - uses: actions/upload-artifact@v4
        with:
          name: model-build-seal
          path: dist/ci-review-build.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: full-review-built-site
          path: dist/
          if-no-files-found: error
  audit-prepared-build:
    # All original publication/inventory assertions still execute. This runner's
    # copy can never replace artifacts from the collector-free proof producer.
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: full-review-built-site
          path: dist/
      - run: node site/ci-model-shards.mjs verify-build
      - name: Preserve mandatory complete publication and deployment inventory audit
        run: node site/ci-model-shards.mjs audit-build
      - name: Require audit to leave the sealed artifact unchanged
        run: node site/ci-model-shards.mjs verify-build
  build:
    permissions:
      contents: read
      actions: read
      checks: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      # Shards keep shallow checkouts. The verifier fetches only an independently
      # authenticated exact ancestor when that object is not already present.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        task: ${{ fromJSON(needs.prepare.outputs.tasks) }}
    needs: [scope, prepare]
    if: needs.scope.outputs.tasks != '["none"]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set isolated publication memo path
        run: echo "CI_PUBLICATION_RECEIPT=$RUNNER_TEMP/publication-${GITHUB_RUN_ID}-${GITHUB_JOB}.json" >> "$GITHUB_ENV"
      - run: npm ci
      # prepare-source already ran every source contract on this checkout/runtime.
      # Its mandatory prepare dependency blocks every shard on a contract failure.
      - uses: actions/download-artifact@v4
        with:
          name: full-review-built-site
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: exact-model-plan
          path: qa/ci-model-proof/
      - name: Verify exact shared build before every browser probe
        run: node site/ci-model-shards.mjs verify-build
      - run: node site/ci-install-chromium.mjs
        id: install_chromium
      - name: Run selected acceptance scope
        env:
          CI_REVIEW_TASK: ${{ matrix.task }}
          FULL_REVIEW: ${{ github.event_name == 'workflow_dispatch' }}
          CI_RUNTIME: ${{ needs.scope.outputs.runtime }}
          CI_MODELS: ${{ needs.scope.outputs.models }}
          CI_PREVIEWS: ${{ needs.scope.outputs.previews }}
          CI_MODEL_PROOF_ACTIVE: 'true'
          QA_MODEL_IDS: ${{ needs.prepare.outputs.fresh_ids }}
          PREVIEW_ASSET_IDS: ${{ needs.prepare.outputs.fresh_ids }}
        run: node site/ci-review.mjs
      - name: Preserve successful separate card-WebP reproduction proof
        if: success() && matrix.task == 'previews'
        uses: actions/upload-artifact@v4
        with:
          name: card-preview-proof
          path: qa/ci-card-preview-proof/receipt.json
          if-no-files-found: error
      - name: Preserve successful exact model shard coverage
        if: success() && startsWith(matrix.task, 'models-')
        uses: actions/upload-artifact@v4
        with:
          name: model-shard-${{ matrix.task }}
          path: qa/ci-model-shards/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-release-${{ matrix.task }}-${{ github.sha }}
          path: |
            qa/ci-timings/
            qa/approved-gallery-browser/
            qa/catalog-scroll/
            qa/release-hover-reveal/
            qa/release-matrix/
            qa/release-strict-gpu/
            qa/release-fallback-only/
            qa/ci-parser/threejs-parser.json
            qa/shared-model-preview/
            qa/handoff-continuity/
            qa/release-conifer-handoff/
            qa/modal-motion/
            qa/interaction-motion/
            qa/web-capture-recheck/render-report.json
            qa/small-life-browser/
            qa/small-fauna-release-20261018/site/
            qa/continuous-release-20261018/site/
            qa/continuous-release-round02-20261018/site/
            qa/continuous-release-round03-20261018/site/
            qa/continuous-release-round04-20261018/site/
            qa/continuous-release-round05-20261018/site/
            qa/continuous-release-round06-20261018/site/
            qa/continuous-release-round07-20261018/site/
            qa/continuous-release-round08-20261018/site/
            qa/continuous-release-round09-20261018/site/
            qa/continuous-release-round10-20261018/site/
            qa/continuous-release-round11-20261018/site/
            qa/continuous-release-round12-20261018/site/
  model-coverage:
    permissions:
      contents: read
      actions: read
      checks: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    name: Verify exact fresh and reused model coverage
    needs: [scope, prepare, build, audit-prepared-build]
    if: always() && needs.scope.result == 'success' && needs.scope.outputs.models == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected browser task to succeed
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          AUDIT_RESULT: ${{ needs.audit-prepared-build.result }}
        run: test "$PREPARE_RESULT" = success && test "$BUILD_RESULT" = success && test "$AUDIT_RESULT" = success
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: full-review-built-site
          path: dist/
      - run: node site/ci-model-shards.mjs verify-build
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.fresh_count != '0'
        with:
          pattern: model-shard-*
          path: qa/ci-model-shards/
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: model-build-seal
          path: qa/ci-model-build/
      - uses: actions/download-artifact@v4
        with:
          name: exact-model-plan
          path: qa/ci-model-proof/
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.fresh_count != '0'
        with:
          name: card-preview-proof
          path: qa/ci-card-preview-proof/
      - name: Independently verify exact fresh plus reused union and one build
        env:
          CI_REVIEW_TASKS: ${{ needs.scope.outputs.tasks }}
          CI_REVIEW_EXECUTED_TASKS: ${{ needs.prepare.outputs.tasks }}
        run: node site/ci-incremental-models.mjs aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: model-proof-v2-${{ github.run_attempt }}
          path: qa/ci-model-proof/model-proof.json
          if-no-files-found: error

name: Full release review
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-release-review-${{ github.ref }}
  cancel-in-progress: true
env:
  SITE_BASE: /lowpoly-vault/
  SITE_ORIGIN: https://s010s.github.io
  QA_PARSER_OUTPUT: qa/ci-parser/threejs-parser.json
jobs:
  scope:
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      models: ${{ steps.scope.outputs.models }}
      previews: ${{ steps.scope.outputs.previews }}
      ids: ${{ steps.scope.outputs.ids }}
      tasks: ${{ steps.scope.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact-tree validated PR reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/ci-reuse.mjs
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_REVIEW: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: |
          if [ "${{ steps.reuse.outputs.reused }}" = "true" ]; then
            echo 'tasks=["none"]' >> "$GITHUB_OUTPUT"
          else
            node site/ci-scope.mjs
          fi
      - name: Record independently verifiable PR source
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node site/ci-provenance.mjs review
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: validated-review-${{ github.run_attempt }}
          path: qa/ci-provenance/review/
          if-no-files-found: error
  prepare:
    needs: scope
    if: needs.scope.outputs.tasks != '["none"]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set isolated publication memo path
        run: echo "CI_PUBLICATION_RECEIPT=$RUNNER_TEMP/publication-${GITHUB_RUN_ID}-${GITHUB_JOB}.json" >> "$GITHUB_ENV"
      - run: npm ci
      - run: node site/ci-scope-test.mjs && node site/ci-model-shards-test.mjs && node site/ci-provenance-test.mjs && node site/ci-reuse-integration-test.mjs && node site/ci-publication-test.mjs && node site/ci-poster-inputs-test.mjs && node site/ci-timed-test.mjs && node site/ci-scene-input-test.mjs
      - name: Brand source contracts when present
        run: if [ -f site/brand-test.mjs ]; then node site/brand-test.mjs; fi
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Complete and audit the shared exact-catalog build once
        run: npm run gallery:posters && REQUIRE_COMPLETE_GALLERY=1 node site/audit-release.mjs
      - name: Bind shared build bytes to source and validation policy
        run: node site/ci-model-shards.mjs seal-build
      - uses: actions/upload-artifact@v4
        with:
          name: model-build-seal
          path: dist/ci-review-build.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: full-review-built-site
          path: dist/
          if-no-files-found: error
  build:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        task: ${{ fromJSON(needs.scope.outputs.tasks) }}
    needs: [scope, prepare]
    if: needs.scope.outputs.tasks != '["none"]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set isolated publication memo path
        run: echo "CI_PUBLICATION_RECEIPT=$RUNNER_TEMP/publication-${GITHUB_RUN_ID}-${GITHUB_JOB}.json" >> "$GITHUB_ENV"
      - run: npm ci
      - run: node site/ci-scope-test.mjs && node site/ci-model-shards-test.mjs && node site/ci-timed-test.mjs && node site/ci-scene-input-test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: full-review-built-site
          path: dist/
      - name: Verify exact shared build before every browser probe
        run: node site/ci-model-shards.mjs verify-build
      - run: npx playwright install --with-deps chromium
        id: install_chromium
      - name: Run selected acceptance scope
        env:
          CI_REVIEW_TASK: ${{ matrix.task }}
          FULL_REVIEW: ${{ github.event_name == 'workflow_dispatch' }}
          CI_RUNTIME: ${{ needs.scope.outputs.runtime }}
          CI_MODELS: ${{ needs.scope.outputs.models }}
          CI_PREVIEWS: ${{ needs.scope.outputs.previews }}
          QA_MODEL_IDS: ${{ needs.scope.outputs.ids }}
          PREVIEW_ASSET_IDS: ${{ needs.scope.outputs.ids }}
        run: node site/ci-review.mjs
      - name: Preserve successful exact model shard coverage
        if: success() && startsWith(matrix.task, 'models-')
        uses: actions/upload-artifact@v4
        with:
          name: model-shard-${{ matrix.task }}
          path: qa/ci-model-shards/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-release-${{ matrix.task }}-${{ github.sha }}
          path: |
            qa/ci-timings/
            qa/approved-gallery-browser/
            qa/catalog-scroll/
            qa/release-hover-reveal/
            qa/release-matrix/
            qa/release-strict-gpu/
            qa/release-fallback-only/
            qa/ci-parser/threejs-parser.json
            qa/shared-model-preview/
            qa/handoff-continuity/
            qa/release-conifer-handoff/
            qa/modal-motion/
            qa/interaction-motion/
            qa/web-capture-recheck/render-report.json
            qa/small-life-browser/
            qa/small-fauna-release-20261018/site/
            qa/continuous-release-20261018/site/
            qa/continuous-release-round02-20261018/site/
            qa/continuous-release-round03-20261018/site/
            qa/continuous-release-round04-20261018/site/
            qa/continuous-release-round05-20261018/site/
            qa/continuous-release-round06-20261018/site/
            qa/continuous-release-round07-20261018/site/
            qa/continuous-release-round08-20261018/site/
            qa/continuous-release-round09-20261018/site/
            qa/continuous-release-round10-20261018/site/
            qa/continuous-release-round11-20261018/site/
            qa/continuous-release-round12-20261018/site/
  model-coverage:
    name: Verify exact model shard coverage
    needs: [scope, prepare, build]
    if: always() && needs.scope.result == 'success' && needs.scope.outputs.models == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected browser task to succeed
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$PREPARE_RESULT" = success && test "$BUILD_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: model-shard-*
          path: qa/ci-model-shards/
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: model-build-seal
          path: qa/ci-model-build/
      - name: Require exact union, matching GLB hashes and one verified build
        env:
          CI_RUNTIME: ${{ needs.scope.outputs.runtime }}
          QA_MODEL_IDS: ${{ needs.scope.outputs.ids }}
        run: node site/ci-model-shards.mjs aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: exact-model-coverage-${{ github.sha }}
          path: qa/ci-model-coverage/coverage.json
          if-no-files-found: error

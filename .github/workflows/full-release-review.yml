name: Check deployed site
on:
  workflow_run:
    workflows: ['Validate and deploy asset gallery']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: live-readback
  cancel-in-progress: true
jobs:
  readback:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Read back the deployed commit, page and sample downloads
        env:
          SITE_URL: https://s010s.github.io/lowpoly-vault/
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node site/ci-live-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-readback-${{ github.event.workflow_run.head_sha }}
          path: qa/live-smoke/
          if-no-files-found: error

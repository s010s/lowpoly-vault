name: Capture explicitly selected reviewed model candidates
on:
  push:
    branches: ['integrate/reviewed-static4-20261026']
    paths:
      - 'qa/static4-presentation-inputs.json'
      - 'assets/additions/**/reviewed-static4-20261026-*/model.glb'
      - 'assets/additions/**/reviewed-static4-20261026-*/preview.png'
      - 'assets/successors/old-five-local-20261026/**/model.glb'
      - 'assets/successors/old-five-local-20261026/**/capture-detail-basis.png'
      - '.github/workflows/reviewed-static4-presentation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the repository-pinned Chromium
        run: node site/ci-install-chromium.mjs
      - name: Capture exact new GLB wheels and actual hover first-frame parity
        env:
          PRODUCTION_WHEEL_INPUTS: qa/static4-presentation-inputs.json
          PRODUCTION_WHEEL_OUTPUT: qa/static4-presentation-capture
        run: node site/capture-production-wheels.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static4-wheel-capture-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/static4-presentation-capture/
          if-no-files-found: error
      - name: Preserve bounded capture semantics
        if: always()
        run: echo 'Unaccepted bounded capture only. Independent source/projection/visual review, authenticated right-detail capture, production tests, approvals and deployment acceptance remain separate mandatory gates.' >> "$GITHUB_STEP_SUMMARY"

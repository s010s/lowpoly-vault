name: Complete publication rejection regressions
on:
  workflow_call:
    inputs:
      site_base:
        type: string
        default: /
      site_origin:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
env:
  SITE_BASE: ${{ inputs.site_base }}
  SITE_ORIGIN: ${{ inputs.site_origin }}
  GITHUB_TOKEN: ${{ github.token }}
  CI_ISOLATE_HISTORICAL: '1'
jobs:
  aggregate:
    name: Require every publication suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - name: Run relevant rejection regressions without duplicate sharding
        run: node site/ci-lean-regressions.mjs publication

name: Capture model images
on:
  workflow_dispatch:
    inputs:
      model_ids:
        description: Comma-separated model IDs to render (explicit scope)
        required: true
        type: string
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node site/ci-install-chromium.mjs
      - name: Render only the requested models with the site's existing renderers
        env:
          MODEL_IDS: ${{ inputs.model_ids }}
        run: node site/capture-model-images.mjs --ids "$MODEL_IDS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-image-capture-${{ github.sha }}-${{ github.run_id }}
          path: qa/model-image-capture/
          if-no-files-found: error
